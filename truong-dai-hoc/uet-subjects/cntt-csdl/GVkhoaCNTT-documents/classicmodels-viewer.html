<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassicModels - CSDL - StuShare</title>
  <link rel="stylesheet" href="/StuShare/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="has-fixed-breadcrumb">
  <!-- Thanh công cụ dùng chung -->
  <div id="header-placeholder"></div>

  <!-- Breadcrumb dùng chung -->
  <div id="breadcrumb-placeholder"></div>

  <main>
    <section class="document-viewer-section">
      <!-- Sử dụng cấu trúc trình chiếu chung để iframe luôn tối ưu -->
      <div class="presentation-container">
        <div class="presentation-wrapper">
          <iframe src="https://www.mysqltutorial.org/getting-started-with-mysql/mysql-sample-database/" loading="lazy" referrerpolicy="no-referrer" title="MySQL Sample Database"></iframe>
        </div>
      </div>
    </section>
  </main>

  <!-- Phần cuối trang dùng chung -->
  <div id="footer-placeholder"></div>

  <script src="/StuShare/assets/js/layout.js"></script>
</body>
</html>
