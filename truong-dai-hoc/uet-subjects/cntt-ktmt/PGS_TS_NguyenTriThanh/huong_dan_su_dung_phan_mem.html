<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng dẫn sử dụng phần mềm - Kiến trúc máy tính - StuShare</title>
    <link rel="stylesheet" href="/StuShare/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="has-fixed-breadcrumb viewer-narrow">
    <div id="header-placeholder"></div>
    <div id="breadcrumb-placeholder"></div>

    <main>
        <section class="document-viewer-section">
            <!-- Bỏ class "document-viewer" và thay bằng "video-player-container" để loại bỏ chiều cao cố định -->
            <div class="video-player-container" style="max-width: 820px; margin: 0 auto;"> 
                
                <!-- Video thứ nhất -->
                <div class="video-aspect-ratio-wrapper">
                    <iframe src="https://drive.google.com/file/d/1bTZLe6T0yexB5U3W14M7TnPZ5ipETYOr/preview" allow="autoplay" title="Video hướng dẫn 1"></iframe>
                </div>

                <!-- Video thứ hai -->
                <div class="video-aspect-ratio-wrapper">
                    <iframe src="https://drive.google.com/file/d/1KMaRwubXG-00n4xszRniPeK-adF3-Ke6/preview" allow="autoplay" title="Video hướng dẫn 2"></iframe>
                </div>

                <!-- Video thứ ba -->
                <div class="video-aspect-ratio-wrapper">
                    <iframe src="https://drive.google.com/file/d/1pMhND3Vo84gahMbTYPa6iSVHI5A6GZfI/preview" allow="autoplay" title="Video hướng dẫn 3"></iframe>
                </div>

            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="/StuShare/assets/js/layout.js"></script>
    <script>
      // (Tuỳ chọn) Nếu cần hiệu ứng riêng cho viewer sau khi DOM sẵn sàng
      document.addEventListener('DOMContentLoaded', () => {});
    </script>
</body>
</html>
